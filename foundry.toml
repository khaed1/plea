[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
gas_limit = "1000000000"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./launch.json" }]
# The whole tree compiles under via_ir as one slow, memory-hungry solc job. A bare `forge build` /
# `forge test` (the default profile) compiles only src, script, the launch-manifest suites in test/
# and any new test file there: under about 1.2 GB. The project's suite lives in test/full/ and the
# fork rehearsals in test/fork/: run them with `FOUNDRY_PROFILE=full` a few files at a time
# (`--match-path 'test/full/{A,B}.t.sol'`); the compiler settings are the same, so ./out is shared.
skip = ["test/fork/*", "test/full/*"]

[profile.full]
skip = []

[profile.default.fuzz]
runs = 32

[fmt]
line_length = 120

[lint]
lint_on_build = false

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
gas_limit = "1000000000"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./launch.json" }]
# The whole tree compiles under via_ir as one slow solc job. The default profile leaves the fork
# rehearsals and the heaviest fuzz/invariant suites out of a bare `forge build` / `forge test`;
# `FOUNDRY_PROFILE=full` compiles everything (the compiler settings are the same, so the artifacts
# in ./out are shared). Run the heavy suites one file at a time with --match-path.
skip = ["test/fork/*", "test/*Invariant.t.sol", "test/*Adversarial.t.sol"]

[profile.full]
skip = []

[profile.default.fuzz]
runs = 32

[fmt]
line_length = 120

[lint]
lint_on_build = false
